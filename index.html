const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
if (new URLSearchParams(location.search).get('chroma') === '1') {
  document.body.style.background = '#00ff00';
}

async function start() {
  const stickers = await Promise.all(artwork.map(async source => {
    const image = new Image();
    image.src = source;
    await image.decode();
    const card = document.createElement('canvas');
    card.width = 960;
    card.height = 460;
    const ink = card.getContext('2d');
    ink.beginPath();
    ink.roundRect(0, 0, card.width, card.height, 34);
    ink.clip();
    ink.drawImage(image, 0, 0);
    return card;
  }));

  const startTime = performance.now();
  const ease = t => t * t * (3 - 2 * t);
  function draw(now) {
    const elapsed = now - startTime;
    const slot = Math.floor(elapsed / 7000);
    const time = elapsed % 7000;
    const sticker = stickers[slot % stickers.length];
    const press = time < 600;
    const progress = press ? 1 - ease(time / 600) : ease(Math.max(0, (time - 6250) / 750));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - progress) * 8);
    ctx.translate(600 + progress * (press ? 175 : -220), 300 - progress * 140);
    ctx.rotate(progress * (press ? 0.18 : -0.24));
    if (progress === 0) {
      ctx.drawImage(sticker, -480, -230);
    } else {
      const hinge = 960 * (1 - progress);
      // Project narrow strips along a rolling fold, with the left edge anchored.
      for (let x = 0; x < 960; x += 4) {
        const bend = Math.max(0, (x - hinge) / 960);
        const nextBend = Math.max(0, (x + 4 - hinge) / 960);
        const projected = x - 460 * bend * bend;
        const next = x + 4 - 460 * nextBend * nextBend;
        const lift = 180 * bend * bend;
        const height = 460 * (1 - 0.43 * bend);
        ctx.filter = 'brightness(' + (1 - 0.40 * bend) + ')';
        ctx.drawImage(sticker, x, 0, 4, 460, projected - 480,
          -height / 2 - lift, Math.max(1, next - projected + 0.5), height);
      }
    }
    ctx.restore();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
start();
